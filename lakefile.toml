name = "CocountableTopology"
defaultTargets = ["CocountableTopology"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.style.longLine = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0-rc2"

[[lean_lib]]
name = "CocountableTopology"
globs = ["Challenge", "CocountableTopology.+"]
